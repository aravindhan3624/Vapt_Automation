  test_steps:
  - 1. Identify all user input fields.
  - 2. Intercept the request in Burp Suite.
  - 3. Insert common XSS payloads.
  - '4. Example: <script>alert(1)</script>, <img src=x onerror=alert(1)>'
  - 5. Submit the request.
  - 6. Observe whether the payload executes.
  - '7. Repeat for:'
  - 8. Search
  - 9. Comments
  - 10. Profile
  - 11. File Name
  - 12. URL Parameters
  - 13. HTTP Headers
  - 14. Test Reflected XSS.
  - 15. Test Stored XSS.
  - 16. Test DOM XSS using browser Developer Tools.
