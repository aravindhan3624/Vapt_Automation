- id: VAPT-018
  title: Host Header manipulation
  sub_of: null
  risk_description: Header manipulation is the insertion of malicious data, which has not been validated, into a HTTP response header. One example of header manipulation is a HTTP response splitting attack. This type of attack exploits applications that allow a carriage return or line feed as input.
  cwe_score: 113
  severity: Medium
  remediation: Avoid using the Host header altogether in server-side code. Double-check whether each URL really needs to be absolute. You will often find that you can just use a relative URL instead. This simple change can help you prevent web cache poisoning vulnerabilities in particular.
  tested_by: Manual
  automatable: false
  reason: Requires crafted Host header attacks.
  test_steps:
  - 1. Steps to Test
  - 2. Capture any authenticated request in Burp Suite.
  - 3. Send the request to Burp Repeater.
  - 4. Modify the Host header to a fake domain.
  - '5. Example: Host: attacker.com'
  - 6. Send the request.
  - '7. Repeat using: Host: evil.local'
  - 8. Observe redirects, password reset links, response headers and HTML.
  - 9. Check whether the modified Host value appears anywhere in the response.
  expected_secure_result: []
- id: VAPT-019
  title: Denial of Service
  sub_of: null
  risk_description: A Denial-of-Service (DoS) attack is an attack meant to shut down a machine or network, making it inaccessible to its intended users. DoS attacks accomplish this by flooding the target with traffic, or sending it information that triggers a crash. In both instances, the DoS attack deprives legitimate users (i.e. employees, members, or account holders) of the service or resource they expected.
  cwe_score: 113
  severity: Medium
  remediation: 'Stopping an active DDoS attack can be hard and may affect your legitimate users. This is why it’s important to take a preemptive approach. In addition to the preventive measures mentioned below, you should also create an emergency DDoS incident response plan, as even the best defenses can sometimes succumb to sophisticated attacks.

    Reference: https://www.onelogin.com/learn/ddos-attack'
  tested_by: Manual
  automatable: false
  reason: Requires load/stress testing tools.
  test_steps:
  - 1. Obtain written approval from the client before performing any stress or DoS-related testing.
  - 2. Identify critical application endpoints (e.g., Login, Search, Dashboard, Report Generation, File Upload).
  - 3. Configure Burp Suite Intruder, JMeter, or another approved load-testing tool.
  - 4. Send a controlled number of concurrent requests (start with a low volume).
  - 5. Gradually increase the request rate while monitoring application behavior.
  - '6. Observe:'
  - 7. Response time
  - 8. CPU usage (if monitoring is available)
  - 9. Memory usage
  - 10. Error responses (500, 503, 504)
  - 11. Timeouts
  - '12. Verify whether the application implements:'
  - 13. Rate limiting
  - 14. Connection throttling
  - 15. IP blocking
  - 16. Web Application Firewall (WAF) protections
  - 17. Stop testing immediately if service degradation is observed.
  - 18. Record all observations and screenshots.
  expected_secure_result:
  - 1. The application continues functioning under the approved test load.
  - 2. Rate limiting or throttling mechanisms activate appropriately.
  - 3. No application crash, memory exhaustion, or service outage occurs.
  - 4. Legitimate users remain able to access the application.
- id: VAPT-020
  title: CAPTCHA Related Vulnerabilities
  sub_of: null
  risk_description: CAPTCHA bypass techniques, such as computer-assisted tools and crowdsourcing, have been developed by hackers, causing CAPTCHA providers to continually monitor and improve their services. CAPTCHA security, like many other security areas, is a fight of innovation between hackers and security professionals.
  cwe_score: 693
  severity: High
  remediation: Ensure that captchas response is at servers level and is not exposed on the HTML web pages code, also, ensure that captcha can not be read by an OCR.
  tested_by: Manual
  automatable: false
  reason: Requires CAPTCHA bypass attempts.
  test_steps:
  - 1. Navigate to the login page.
  - 2. Verify whether CAPTCHA is displayed.
  - 3. Attempt login without solving the CAPTCHA.
  - 4. Modify the CAPTCHA parameter using Burp Repeater.
  - 5. Replay an old CAPTCHA response.
  - 6. Submit invalid CAPTCHA values.
  - 7. Perform multiple failed login attempts.
  - 8. Verify whether CAPTCHA is enforced after repeated failures.
  - 9. Attempt to bypass CAPTCHA by removing the parameter.
  expected_secure_result:
  - 1. CAPTCHA validation occurs on the server.
  - 2. Replay is rejected.
  - 3. CAPTCHA cannot be bypassed.
