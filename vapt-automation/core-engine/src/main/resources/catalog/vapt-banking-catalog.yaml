catalog_name: Banking Domain VAPT Checklist
source: VAPT_Banking Domain check list_Final (1).xlsx
version: '1.0'
findings:
- id: VAPT-001
  title: 'Insecure Transport: Unencrypted Communication'
  sub_of: null
  risk_description: Unencrypted communication exposes data to interception during transmission.
  cwe_score: 29
  severity: Medium
  remediation: "1: Ensure HTTPS is maintained for all services by configuring it in both the web.config file and the IIS server.\n\nEx:\n1: Got to Web App config >> Add rule >> Rewrite Http to Https \n2: Go to IIS Server >> Routing >> binding >>Rewrite  Http to Https"
  tested_by: AI + Manual
  automatable: true
  reason: AI can verify HTTPS/TLS from HAR. Manual validates HTTP to HTTPS redirect and configuration.
  test_steps:
  - 1. Configure Burp Suite as the browser proxy.
  - 2. Browse the application using the HTTPS URL.
  - 3. Manually change the URL from https:// to http://.
  - 4. Observe whether the application automatically redirects to HTTPS.
  - 5. Capture both the HTTP request and HTTPS response in Burp Suite.
  - 6. Verify that no login page or sensitive page is accessible over HTTP.
  - 7. Check whether the Strict-Transport-Security (HSTS) header is present.
  - 8. Verify that all resources (CSS, JS, Images, APIs) are loaded only over HTTPS.
  - 9. Record screenshots of the HTTP redirect and response headers.
  expected_secure_result:
  - 1. HTTP automatically redirects to HTTPS.
  - 2. No sensitive data is transmitted over HTTP.
  - 3. HSTS header is enabled.
- id: VAPT-002
  title: Insecure word Transmission
  sub_of: null
  risk_description: The application configuration should ensure that SSL is used for all access controlled pages. If an application uses SSL to guarantee confidential communication with client browsers, the application configuration should make it impossible to view any access controlled page without SSL. However, it is not an uncommon problem that the configuration of the application fails to enforce the use of SSL on pages that contain sensitive data.
  cwe_score: 319
  severity: Medium
  remediation: 'Use secure transport protocols: Use secure transport protocols such as HTTPS or TLS, which encrypt data transmission over the network and provide authentication mechanisms to ensure secure communication.'
  tested_by: AI + Manual
  automatable: true
  reason: AI checks HTTPS/encrypted traffic. Manual verifies sensitive data exposure scenarios.
  test_steps:
  - 1. Open Burp Suite Proxy.
  - 2. Browse the complete application.
  - 3. Verify all requests use TLS 1.2 or TLS 1.3.
  - 4. Check response headers for HSTS.
  - 5. Use SSL Labs or Nmap (if permitted) to identify supported TLS versions.
  - 6. Verify weak protocols (SSLv2, SSLv3, TLS1.0, TLS1.1) are disabled.
  - 7. Check weak cipher suites are not enabled.
  - 8. Capture evidence.
  expected_secure_result:
  - 1. Only TLS 1.2/1.3 is supported.
  - 2. Weak protocols are disabled.
  - 3. Strong cipher suites are used.
- id: VAPT-003
  title: Default OTP Usage
  sub_of: null
  risk_description: Attackers may exploit this predictability to guess or generate valid OTPs, leading to unauthorized access.
  cwe_score: 310
  severity: Medium
  remediation: Do not use default OTPs; instead, implement robust and secure OTP generation methods.
  tested_by: Manual
  automatable: false
  reason: Requires OTP generation and validation testing.
  test_steps:
  - 1. Navigate to Login.
  - 2. Trigger OTP generation.
  - 3. Note the received OTP.
  - 4. Logout.
  - 5. Login again.
  - 6. Generate another OTP.
  - 7. Compare both OTP values.
  - 8. Attempt to reuse the previous OTP.
  - 9. Verify OTP uniqueness.
  - 10. Capture evidence.
  expected_secure_result:
  - 1. Every login generates a unique OTP.
  - 2. Old OTP cannot be reused.
- id: VAPT-004
  title: Improper OTP implementation
  sub_of: null
  risk_description: 'If OTPs are generated using predictable algorithms or have insufficient entropy, attackers may be able to predict or guess valid OTPs.

    Predictable OTPs increase the likelihood of successful brute-force or guessing attacks.'
  cwe_score: 22
  severity: Medium
  remediation: Utilize AES 256 encryption methodology for securing all key and sensitive information.
  tested_by: Manual
  automatable: false
  reason: Requires OTP entropy, expiry, replay and bypass testing.
  test_steps:
  - 1. Request an OTP.
  - 2. Wait for expiry time.
  - 3. Enter the expired OTP.
  - 4. Attempt multiple incorrect OTP submissions.
  - 5. Observe retry limits.
  - 6. Verify OTP expiration.
  - 7. Verify OTP cannot be guessed.
  - 8. Capture screenshots.
  expected_secure_result:
  - 1. OTP expires after configured time.
  - 2. Invalid OTP attempts are limited.
  - 3. OTP cannot be reused.
- id: VAPT-005
  title: OTP Bypass
  sub_of: null
  risk_description: An Advesary will be able to bypass the OTP and authenticate himself as a user. An Advesary may able to register and access accounts using  another mobile number without revealing his identity.
  cwe_score: 22
  severity: Medium
  remediation: Implement a session handling method, ensuring the creation of a new session with each login action.
  tested_by: Manual
  automatable: false
  reason: Requires authentication flow manipulation.
  test_steps:
  - 1. Start login.
  - 2. Intercept OTP verification request in Burp Suite.
  - 3. Remove OTP parameter.
  - 4. Modify OTP value.
  - 5. Replay the request.
  - 6. Try skipping the OTP verification API.
  - 7. Attempt direct access to authenticated pages.
  - 8. Record responses.
  expected_secure_result:
  - 1. OTP validation cannot be bypassed.
  - 2. Server rejects requests without valid OTP.
- id: VAPT-006
  title: Hardcoded sensitive information
  sub_of: null
  risk_description: An Advesary would use this information to plan potential attacks against the organoization and its users
  cwe_score: 40
  severity: Medium
  remediation: Remove the Discontent data
  tested_by: AI
  automatable: true
  reason: Can scan JS files, configs, responses for secrets/credentials.
  test_steps:
  - 1. Browse the application.
  - 2. Download all JavaScript files.
  - '3. Search for:'
  - 4. password
  - 5. token
  - 6. apiKey
  - 7. secret
  - 8. Authorization
  - 9. Bearer
  - 10. Client Secret
  - 11. Review config.js.
  - 12. Review source maps.
  - 13. Review HTML source.
  - 14. Review exposed JSON responses.
  - 15. Validate whether discovered credentials are usable (only in authorized environments).
  - 16. Capture evidence.
  expected_secure_result:
  - 1. No hardcoded credentials.
  - 2. No API secrets.
  - 3. No encryption keys.
  - 4. No test accounts.
- id: VAPT-007
  title: Session Fixation
  sub_of: null
  risk_description: An advesary can take over (Hijack) the session by using the same session ID and use it to their advantage
  cwe_score: 20
  severity: Medium
  remediation: Implement a session handling method, ensuring the creation of a new session with each login action.
  tested_by: Manual
  automatable: false
  reason: Requires browser session comparison before/after login.
  test_steps:
  - 1. Open the application.
  - 2. Capture the session cookie before login.
  - 3. Login successfully.
  - 4. Compare session IDs before and after login.
  - 5. Logout.
  - 6. Login again.
  - 7. Compare the newly issued session ID.
  - 8. Attempt to reuse the old session.
  - 9. Capture evidence.
  expected_secure_result:
  - 1. New session ID is generated after login.
  - 2. Old session becomes invalid.
- id: VAPT-008
  title: Server Version Disclosure
  sub_of: null
  risk_description: This information might help an adversary gain a greater understanding of systems in use and potentially develop further attacks targeted at the specific version of the services
  cwe_score: 20
  severity: Medium
  remediation: "In IIS server \nDisregard the website and eliminate the disclosure of the IIS version from the response."
  tested_by: AI
  automatable: true
  reason: Can identify Server headers/framework banners.
  test_steps:
  - 1. Browse multiple pages.
  - 2. Inspect all response headers.
  - '3. Check for:'
  - 4. Server
  - 5. X-Powered-By
  - 6. ASP.NET Version
  - 7. PHP Version
  - 8. Tomcat
  - 9. IIS
  - 10. Trigger error pages (404, 405, 500).
  - 11. Check whether framework versions are disclosed.
  - 12. Capture screenshots.
  expected_secure_result:
  - 1. Server banner removed.
  - 2. Framework versions hidden.
  - 3. No version disclosure.
- id: VAPT-009
  title: Cross domain Script Include
  sub_of: null
  risk_description: An attacker can modify the script to perform malicious actions within your application.
  cwe_score: 22
  severity: Medium
  remediation: It is advisable to avoid including scripts from untrusted sources whenever possible.
  tested_by: AI + Manual
  automatable: true
  reason: AI identifies external scripts; manual validates trust/SRI/security impact.
  test_steps:
  - 1. Open Developer Tools.
  - 2. Review all loaded JavaScript files.
  - 3. Identify third-party domains.
  - 4. Verify whether external scripts use HTTPS.
  - 5. Check for Subresource Integrity (SRI).
  - 6. Review CSP directives.
  - 7. Verify only trusted domains are allowed.
  - 8. Capture screenshots.
  expected_secure_result:
  - 1. Only trusted external scripts are loaded.
  - 2. HTTPS is enforced.
  - 3. SRI is implemented where applicable.
- id: VAPT-010
  title: Missing Content Security Policy
  sub_of: null
  risk_description: In abense of this header, an attacker can exploit client-side vulnerabilites such as cross-site scripting, clickjacking, and cross-site request forgery
  cwe_score: 22
  severity: Medium
  remediation: 'IIS >> Employ the new header "Content Security Policy: default-src."'
  tested_by: AI
  automatable: true
  reason: Header analysis can validate CSP presence/configuration.
  test_steps:
  - 1. Browse every major page.
  - 2. Inspect response headers.
  - 3. Verify the Content-Security-Policy header is present.
  - '4. Review directives:'
  - 5. default-src
  - 6. script-src
  - 7. object-src
  - 8. style-src
  - 9. frame-src
  - 10. Verify unsafe-inline and unsafe-eval are not used unless justified.
  - 11. Confirm CSP is applied to HTML documents.
  - 12. Capture screenshots.
  expected_secure_result:
  - 1. CSP is present on all HTML pages.
  - 2. No unsafe directives.
  - 3. Only trusted sources are allowed.
- id: VAPT-011
  title: Traffic Decryption
  sub_of: null
  risk_description: Traffic decryption raises significant privacy concerns as it involves intercepting and inspecting the content of encrypted communication. Users may be unaware that their data is being decrypted.
  cwe_score: 40
  severity: Medium
  remediation: Utilize AES 256 encryption methodology for securing all key and sensitive information.
  tested_by: AI + Manual
  automatable: true
  reason: AI identifies encryption implementation; manual validates cryptographic weakness.
  test_steps:
  - 1. Open Burp Suite and configure the browser to use Burp as the proxy.
  - 2. Browse to the application's login page.
  - 3. Capture the initial request and note the Session ID (JSESSIONID/PHPSESSID/ASP.NET Session ID) issued before login.
  - 4. Without closing the browser, log in using valid credentials.
  - 5. Capture the authentication response.
  - 6. Compare the Session ID before login and after successful login.
  - 7. Log out from the application.
  - 8. Log in again using the same browser session.
  - 9. Compare the Session ID issued after the second login.
  - 10. Attempt to manually reuse the pre-authentication Session ID by editing the cookie in Burp Repeater.
  - 11. Observe whether the application accepts the old Session ID.
  expected_secure_result:
  - 1. A completely new Session ID is generated after successful authentication.
  - 2. Old Session IDs become invalid.
  - 3. Session fixation is not possible.
