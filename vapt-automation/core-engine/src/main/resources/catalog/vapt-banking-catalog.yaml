- id: VAPT-024
  title: HTTP Splitting/Smuggling
  sub_of: null
  risk_description: This section illustrates examples of attacks that leverage specific features of the HTTP protocol, either by exploiting weaknesses of the web application or peculiarities in the way different agents interpret HTTP messages.
  cwe_score: 444
  severity: High
  remediation: While manipulating the any headers server should not respond and should displayed with invalid request with 400 or 404 server errors.
