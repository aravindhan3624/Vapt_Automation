  test_steps:
  - AI
  expected_secure_result: []
- id: VAPT-013
  title: Shoulder Surfing of Critical Data
  sub_of: null
  risk_description: shoulder surfing attack describes a situation where the attacker can physically view the device screen and keypad to obtain personal information. It is one of the few attack methods requiring the attacker to be physically close to the victim to succeed.
  cwe_score: 639
  severity: High
  remediation: Add masking to the Entered OTP.
  tested_by: Manual
  automatable: false
  reason: Requires UI/device testing.
  test_steps:
  - 1. Open the application login page or any screen where sensitive information (OTP, Password, PIN, CVV, Aadhaar, etc.) is entered.
  - 2. Verify whether the sensitive input field masks the entered characters (e.g., ●●●● or ****).
  - 3. Check whether OTP or password remains visible after typing.
  - 4. Click the "Show Password" icon (if available) and verify that it works only on user action.
  - 5. Observe whether browser auto-complete or predictive text is enabled for sensitive fields.
  - 6. Verify whether copy-paste is allowed for OTP fields (based on application security policy).
  - 7. Verify whether screenshots can expose sensitive values (where applicable).
  - 8. Observe the screen from different viewing angles to determine whether sensitive information is easily visible (shoulder surfing risk).
  - 9. Capture screenshots as evidence.
  expected_secure_result:
  - 1. Passwords and OTPs are masked by default.
  - 2. Sensitive fields disable autocomplete and predictive text where applicable.
  - 3. Sensitive information is not unnecessarily displayed after entry.
  - 4. Show Password functionality is controlled and user-initiated.
- id: VAPT-014
  title: Cookies attributes
  sub_of: null
  risk_description: Web Cookies (herein referred to as cookies) are often a key attack vector for malicious users (typically targeting other users) and the application should always take due diligence to protect cookies.
  cwe_score: 614
  severity: High
  remediation: The secure flag should be set on all cookies that are used for transmitting sensitive data when accessing content over HTTPS. If cookies are used to transmit session tokens, then areas of the application that are accessed over HTTPS should employ their own session handling mechanism, and the session tokens used should never be transmitted over unencrypted communications.
  tested_by: AI
  automatable: true
  reason: Secure, HttpOnly, SameSite validation from responses.
  test_steps:
  - AI
  expected_secure_result: []
- id: VAPT-015
  title: Session Fixation
  sub_of: null
  risk_description: Session Fixation is an attack that permits an attacker to hijack a valid user session. The attack explores a limitation in the way the web application manages the session ID, more specifically the vulnerable web application.
  cwe_score: 384
  severity: Medium
  remediation: Implement session timeout after 10 minutes (for Banking Sites) or as per security policy.
  tested_by: Manual
  automatable: false
  reason: Requires waiting period and session expiry testing.
  test_steps:
  - 1. Login to the application.
  - 2. Open Burp Suite HTTP History.
  - 3. Do not perform any activity.
  - 4. Wait for the configured timeout period (10–15 minutes or as per application policy).
  - 5. After timeout, click any menu or refresh the page.
  - 6. Observe whether the application redirects to the login page.
  - 7. Capture the server response.
  - 8. Verify whether the previous authentication token becomes invalid.
  - 9. Attempt to reuse the old authentication token through Burp Repeater.
  expected_secure_result:
  - 1. User is automatically logged out.
  - 2. Previous session/token becomes invalid.
  - 3. Access is denied until re-authentication.
