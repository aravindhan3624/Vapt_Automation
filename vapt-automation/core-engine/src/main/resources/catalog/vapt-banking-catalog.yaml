- id: VAPT-022
  title: Cross site Scripting
  sub_of: null
  risk_description: Cross site scripting (XSS) is an attack in which an attacker injects malicious executable scripts into the code of a trusted application or website. Attackers often initiate an XSS attack by sending a malicious link to a user and enticing the user to click it.
  cwe_score: 79
  severity: Medium
  remediation: Recommended to enable X-XSS-Protection and set the value as “1; mode=block”
  tested_by: Manual
  automatable: false
